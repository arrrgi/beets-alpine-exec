[project]
name = "beets-alpine-exec"
version = "1.0.2"
description = "Batteries included Beets in Docker"
readme = "README.md"
authors = [
    { name = "Rowan Gillson", email = "devops@the.bald.engineer" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "beets>=2.8.0",
    "colorama>=0.4.6",
    "flask>=3.1.3",
    "pillow>=12.2.0",
    "pyacoustid>=1.3.0",
    "pylast>=7.0.2",
    "requests>=2.33.1",
    "unidecode>=1.4.0",
    "wheel>=0.48.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.13.9",
    "pre-commit>=4.5.1",
]

[tool.uv]
override-dependencies = [
    "numba; sys_platform == 'never'",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.2"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "uv"
annotated_tag = true
version_files = [
    "pyproject.toml:version",
]
